<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="tccBgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0c12" />
      <stop offset="50%" stop-color="#101422" />
      <stop offset="100%" stop-color="#090b10" />
    </linearGradient>

    <radialGradient id="tccGlowIndigo" cx="75%" cy="30%" r="65%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.25" />
      <stop offset="60%" stop-color="#818cf8" stop-opacity="0.05" />
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="tccGlowCyan" cx="25%" cy="85%" r="55%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.18" />
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0" />
    </radialGradient>

    <linearGradient id="tccCardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#181d2a" stop-opacity="0.95" />
      <stop offset="100%" stop-color="#111420" stop-opacity="0.98" />
    </linearGradient>

    <linearGradient id="tccBtnGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#818cf8" />
    </linearGradient>

    <filter id="tccShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="20" stdDeviation="28" flood-color="#000000" flood-opacity="0.75" />
      <feDropShadow dx="0" dy="4" stdDeviation="14" flood-color="#6366f1" flood-opacity="0.22" />
    </filter>
  </defs>

  <!-- Canvas Background -->
  <rect width="1200" height="675" fill="url(#tccBgGrad)" />
  <rect width="1200" height="675" fill="url(#tccGlowIndigo)" />
  <rect width="1200" height="675" fill="url(#tccGlowCyan)" />

  <!-- Subtle Blueprint Tech Grid -->
  <g opacity="0.07" stroke="#818cf8" stroke-width="1">
    <line x1="0" y1="135" x2="1200" y2="135" />
    <line x1="0" y1="270" x2="1200" y2="270" />
    <line x1="0" y1="405" x2="1200" y2="405" />
    <line x1="0" y1="540" x2="1200" y2="540" />
    <line x1="240" y1="0" x2="240" y2="675" />
    <line x1="480" y1="0" x2="480" y2="675" />
    <line x1="720" y1="0" x2="720" y2="675" />
    <line x1="960" y1="0" x2="960" y2="675" />
  </g>

  <!-- Left Editorial Branding -->
  <g transform="translate(70, 95)">
    <!-- Badge -->
    <g>
      <rect x="0" y="0" width="240" height="32" rx="16" fill="rgba(99, 102, 241, 0.12)" stroke="#818cf8" stroke-width="1.2" stroke-opacity="0.5" />
      <circle cx="16" cy="16" r="4.5" fill="#818cf8" />
      <text x="30" y="21" font-family="-apple-system, BlinkMacSystemFont, 'Plus Jakarta Sans', sans-serif" font-size="11.5" font-weight="700" fill="#c7d2fe" letter-spacing="1">B2B SAAS · MULTI-TENANT CMS</text>
    </g>

    <!-- Headline -->
    <text x="0" y="85" font-family="'Space Grotesk', -apple-system, sans-serif" font-size="44" font-weight="800" fill="#ffffff" letter-spacing="-1.2">Tythas Control</text>
    <text x="0" y="132" font-family="'Space Grotesk', -apple-system, sans-serif" font-size="44" font-weight="800" fill="#818cf8" letter-spacing="-1.2">Center.</text>
    
    <text x="0" y="172" font-family="'Newsreader', Georgia, serif" font-size="22" font-style="italic" font-weight="400" fill="#e0e7ff">Every client site, one unified platform.</text>

    <!-- Description Paragraph -->
    <text x="0" y="220" font-family="-apple-system, BlinkMacSystemFont, 'Plus Jakarta Sans', sans-serif" font-size="14.5" fill="#9ca3af" font-weight="400">A multi-tenant website management platform designed</text>
    <text x="0" y="244" font-family="-apple-system, BlinkMacSystemFont, 'Plus Jakarta Sans', sans-serif" font-size="14.5" fill="#9ca3af" font-weight="400">and built for my own agency — one dashboard to run</text>
    <text x="0" y="268" font-family="-apple-system, BlinkMacSystemFont, 'Plus Jakarta Sans', sans-serif" font-size="14.5" fill="#9ca3af" font-weight="400">every client site's pages, blog, SEO, forms, leads,</text>
    <text x="0" y="292" font-family="-apple-system, BlinkMacSystemFont, 'Plus Jakarta Sans', sans-serif" font-size="14.5" fill="#9ca3af" font-weight="400">and uptime instead of fragmented logins.</text>

    <!-- Tech Stack Pills -->
    <g transform="translate(0, 328)">
      <rect x="0" y="0" width="75" height="26" rx="13" fill="#141824" stroke="#2a3044" stroke-width="1" />
      <text x="13" y="17" font-family="sans-serif" font-size="11" font-weight="600" fill="#d1d5db">Next.js</text>

      <rect x="83" y="0" width="70" height="26" rx="13" fill="#141824" stroke="#2a3044" stroke-width="1" />
      <text x="96" y="17" font-family="sans-serif" font-size="11" font-weight="600" fill="#d1d5db">Prisma</text>

      <rect x="161" y="0" width="94" height="26" rx="13" fill="#141824" stroke="#2a3044" stroke-width="1" />
      <text x="173" y="17" font-family="sans-serif" font-size="11" font-weight="600" fill="#d1d5db">PostgreSQL</text>

      <rect x="263" y="0" width="75" height="26" rx="13" fill="#141824" stroke="#2a3044" stroke-width="1" />
      <text x="274" y="17" font-family="sans-serif" font-size="11" font-weight="600" fill="#d1d5db">Tailwind</text>

      <rect x="346" y="0" width="65" height="26" rx="13" fill="#141824" stroke="#2a3044" stroke-width="1" />
      <text x="357" y="17" font-family="sans-serif" font-size="11" font-weight="600" fill="#d1d5db">Vercel</text>
    </g>

    <!-- Key Outcome Highlight -->
    <g transform="translate(0, 385)">
      <rect x="0" y="0" width="410" height="74" rx="16" fill="rgba(24, 29, 44, 0.75)" stroke="rgba(99, 102, 241, 0.25)" stroke-width="1" />
      <circle cx="28" cy="37" r="14" fill="rgba(99, 102, 241, 0.15)" />
      <!-- Layers icon -->
      <path d="M 22 34 L 28 31 L 34 34 L 28 37 Z M 22 38 L 28 41 L 34 38 M 22 42 L 28 45 L 34 42" stroke="#818cf8" stroke-width="1.8" fill="none" stroke-linecap="round" stroke-linejoin="round" />
      <text x="52" y="31" font-family="sans-serif" font-size="13" font-weight="700" fill="#ffffff">One Connector Layer, Infinite Stacks</text>
      <text x="52" y="52" font-family="sans-serif" font-size="11.5" fill="#9ca3af">Eliminating 99 fragmented points of failure across client sites.</text>
    </g>
  </g>

  <!-- Right Visual: High-Fidelity Multi-Tenant Dashboard Mockup -->
  <g transform="translate(530, 60)" filter="url(#tccShadow)">
    <!-- Browser Window Outer Shell -->
    <rect x="0" y="0" width="610" height="555" rx="18" fill="#121520" stroke="#272d42" stroke-width="2" />

    <!-- Window Top Header Bar -->
    <rect x="0" y="0" width="610" height="42" rx="18" fill="#191e2e" />
    <rect x="0" y="24" width="610" height="18" fill="#191e2e" />
    <line x1="0" y1="42" x2="610" y2="42" stroke="#252b3d" stroke-width="1" />

    <!-- Window Dots -->
    <circle cx="22" cy="21" r="5" fill="#ef4444" opacity="0.85" />
    <circle cx="38" cy="21" r="5" fill="#f59e0b" opacity="0.85" />
    <circle cx="54" cy="21" r="5" fill="#10b981" opacity="0.85" />

    <!-- URL Bar -->
    <rect x="180" y="10" width="250" height="22" rx="6" fill="#0d1017" stroke="#272d40" stroke-width="1" />
    <text x="305" y="25" font-family="monospace" font-size="10.5" fill="#9ca3af" text-anchor="middle">controlcenter.tythas.com</text>

    <!-- App Inner Area: Sidebar + Main Content -->
    <g transform="translate(0, 42)">
      <!-- Sidebar -->
      <rect x="0" y="0" width="145" height="513" fill="#131722" />
      <line x1="145" y1="0" x2="145" y2="513" stroke="#22283a" stroke-width="1" />

      <!-- Agency Brand Pill in Sidebar -->
      <g transform="translate(14, 18)">
        <rect x="0" y="0" width="26" height="26" rx="7" fill="url(#tccBtnGrad)" />
        <text x="13" y="18" font-family="'Space Grotesk', sans-serif" font-size="14" font-weight="900" fill="#ffffff" text-anchor="middle">T</text>
        <text x="34" y="18" font-family="'Space Grotesk', sans-serif" font-size="13" font-weight="700" fill="#ffffff">Tythas</text>
      </g>

      <!-- Client Switcher Dropdown in Sidebar -->
      <g transform="translate(12, 58)">
        <rect x="0" y="0" width="121" height="30" rx="8" fill="#1b2030" stroke="#2f374e" stroke-width="1" />
        <circle cx="12" cy="15" r="4" fill="#10b981" />
        <text x="24" y="19" font-family="sans-serif" font-size="10" font-weight="600" fill="#e2e8f0">Copper Chocs</text>
        <path d="M 106 13 L 110 17 L 114 13" stroke="#9ca3af" stroke-width="1.5" fill="none" />
      </g>

      <!-- Nav Items -->
      <g transform="translate(12, 108)">
        <!-- Overview (Active) -->
        <rect x="0" y="0" width="121" height="28" rx="7" fill="rgba(99, 102, 241, 0.18)" />
        <circle cx="14" cy="14" r="3.5" fill="#818cf8" />
        <text x="26" y="18" font-family="sans-serif" font-size="11" font-weight="700" fill="#ffffff">Dashboard</text>

        <!-- Pages -->
        <g transform="translate(0, 36)">
          <text x="26" y="18" font-family="sans-serif" font-size="11" font-weight="500" fill="#9ca3af">Pages &amp; Blog</text>
        </g>

        <!-- SEO -->
        <g transform="translate(0, 68)">
          <text x="26" y="18" font-family="sans-serif" font-size="11" font-weight="500" fill="#9ca3af">SEO &amp; Schema</text>
        </g>

        <!-- Forms & Leads with Badge -->
        <g transform="translate(0, 100)">
          <text x="26" y="18" font-family="sans-serif" font-size="11" font-weight="500" fill="#9ca3af">Forms &amp; Leads</text>
          <rect x="100" y="6" width="16" height="16" rx="8" fill="#ef4444" />
          <text x="108" y="18" font-family="sans-serif" font-size="9" font-weight="700" fill="#ffffff" text-anchor="middle">3</text>
        </g>

        <!-- Health -->
        <g transform="translate(0, 132)">
          <text x="26" y="18" font-family="sans-serif" font-size="11" font-weight="500" fill="#9ca3af">Site Health</text>
        </g>

        <!-- Settings -->
        <g transform="translate(0, 164)">
          <text x="26" y="18" font-family="sans-serif" font-size="11" font-weight="500" fill="#9ca3af">Settings</text>
        </g>
      </g>

      <!-- Main Body Content Area -->
      <g transform="translate(160, 16)">
        
        <!-- Header row -->
        <text x="0" y="16" font-family="'Space Grotesk', sans-serif" font-size="18" font-weight="800" fill="#ffffff">Overview</text>
        <g transform="translate(320, 0)">
          <rect x="0" y="0" width="112" height="24" rx="12" fill="rgba(16, 185, 129, 0.15)" stroke="#10b981" stroke-width="1" />
          <circle cx="10" cy="12" r="3.5" fill="#10b981" />
          <text x="20" y="16" font-family="sans-serif" font-size="9.5" font-weight="700" fill="#6ee7b7">Connected · Live</text>
        </g>

        <!-- ATTENTION LIST BANNER (Crucial UX feature from Case Study) -->
        <g transform="translate(0, 32)">
          <rect x="0" y="0" width="434" height="66" rx="12" fill="rgba(234, 179, 8, 0.08)" stroke="rgba(234, 179, 8, 0.3)" stroke-width="1" />
          <circle cx="20" cy="33" r="10" fill="rgba(234, 179, 8, 0.15)" />
          <text x="20" y="37" font-family="sans-serif" font-size="11" font-weight="bold" fill="#facc15" text-anchor="middle">!</text>
          
          <text x="40" y="24" font-family="sans-serif" font-size="11.5" font-weight="700" fill="#fef08a">Attention List · 2 items need action</text>
          <text x="40" y="42" font-family="sans-serif" font-size="10.5" fill="#d1d5db">• SSL auto-renewal pending for <tspan fill="#ffffff" font-weight="600">client-beta.com</tspan> (4 days left)</text>
          <text x="40" y="56" font-family="sans-serif" font-size="10.5" fill="#d1d5db">• 1 unindexed new blog post on <tspan fill="#ffffff" font-weight="600">Copper Chocs</tspan> (missing canonical)</text>
        </g>

        <!-- Metrics Row (3 cards) -->
        <g transform="translate(0, 112)">
          <!-- Card 1 -->
          <rect x="0" y="0" width="136" height="74" rx="12" fill="#161b27" stroke="#252c3f" stroke-width="1" />
          <text x="12" y="22" font-family="sans-serif" font-size="10" font-weight="700" fill="#9ca3af">CONNECTED SITES</text>
          <text x="12" y="48" font-family="'Space Grotesk', sans-serif" font-size="22" font-weight="800" fill="#ffffff">14</text>
          <text x="12" y="64" font-family="sans-serif" font-size="9.5" fill="#34d399">100% verified write</text>

          <!-- Card 2 -->
          <rect x="148" y="0" width="136" height="74" rx="12" fill="#161b27" stroke="#252c3f" stroke-width="1" />
          <text x="160" y="22" font-family="sans-serif" font-size="10" font-weight="700" fill="#9ca3af">LEAD INQUIRIES</text>
          <text x="160" y="48" font-family="'Space Grotesk', sans-serif" font-size="22" font-weight="800" fill="#818cf8">128</text>
          <text x="160" y="64" font-family="sans-serif" font-size="9.5" fill="#a5b4fc">+34% this month</text>

          <!-- Card 3 -->
          <rect x="296" y="0" width="138" height="74" rx="12" fill="#161b27" stroke="#252c3f" stroke-width="1" />
          <text x="308" y="22" font-family="sans-serif" font-size="10" font-weight="700" fill="#9ca3af">GLOBAL UPTIME</text>
          <text x="308" y="48" font-family="'Space Grotesk', sans-serif" font-size="22" font-weight="800" fill="#34d399">99.98%</text>
          <text x="308" y="64" font-family="sans-serif" font-size="9.5" fill="#9ca3af">Last incident: 42d ago</text>
        </g>

        <!-- CMS Editor Preview Sub-Card -->
        <g transform="translate(0, 200)">
          <rect x="0" y="0" width="434" height="152" rx="12" fill="#151925" stroke="#252c3f" stroke-width="1" />
          
          <!-- Editor Sub-Header -->
          <rect x="0" y="0" width="434" height="34" rx="12" fill="#1a202f" />
          <rect x="0" y="22" width="434" height="12" fill="#1a202f" />
          <line x1="0" y1="34" x2="434" y2="34" stroke="#2a334a" stroke-width="1" />
          
          <text x="14" y="22" font-family="sans-serif" font-size="11" font-weight="700" fill="#ffffff">Blog Post: "How We Designed Our 2026 Shopify Store"</text>
          
          <!-- Publish Pill Button -->
          <rect x="352" y="6" width="70" height="22" rx="6" fill="url(#tccBtnGrad)" />
          <text x="387" y="20" font-family="sans-serif" font-size="10" font-weight="700" fill="#ffffff" text-anchor="middle">Publish Live</text>

          <!-- Mini Editor Body -->
          <g transform="translate(14, 46)">
            <!-- Classic WYSIWYG Toolbar (Jakob's Law decision) -->
            <rect x="0" y="0" width="406" height="24" rx="6" fill="#1e2538" />
            <text x="12" y="16" font-family="sans-serif" font-size="10" font-weight="700" fill="#9ca3af">B  I  U  H2  H3  Link  Image  Quote  FAQ-Schema</text>
            
            <!-- Article Body Preview -->
            <text x="0" y="42" font-family="sans-serif" font-size="11" fill="#e2e8f0" font-weight="600">Bakery customers don't read feature lists; they look for dessert.</text>
            <text x="0" y="58" font-family="sans-serif" font-size="10.5" fill="#9ca3af">When designing for a 30-year legacy bakery in Pune, the highest leverage</text>
            <text x="0" y="74" font-family="sans-serif" font-size="10.5" fill="#9ca3af">decision was placing celebration products directly above promotional banners...</text>
            
            <!-- Live Preview Indicator -->
            <g transform="translate(0, 88)">
              <rect x="0" y="0" width="130" height="18" rx="4" fill="rgba(6, 182, 212, 0.12)" stroke="#06b6d4" stroke-width="0.8" />
              <text x="8" y="13" font-family="sans-serif" font-size="9" font-weight="600" fill="#67e8f9">Live Desktop &amp; Mobile Preview ✓</text>
            </g>
          </g>
        </g>

        <!-- System Architecture Chip Footer -->
        <g transform="translate(0, 364)">
          <text x="0" y="16" font-family="sans-serif" font-size="10.5" font-weight="700" fill="#818cf8">ENGINEERING LAYER:</text>
          <text x="128" y="16" font-family="sans-serif" font-size="10.5" fill="#9ca3af">Prisma Multi-Tenant Schemas · Next.js Server Actions · Universal REST API Connector</text>
        </g>

      </g>
    </g>
  </g>
</svg>
