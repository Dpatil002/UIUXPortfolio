<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0e17" />
      <stop offset="50%" stop-color="#111827" />
      <stop offset="100%" stop-color="#080c14" />
    </linearGradient>

    <radialGradient id="glowPurple" cx="20%" cy="30%" r="50%">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="glowCyan" cx="80%" cy="70%" r="60%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0" />
    </radialGradient>

    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.95" />
    </linearGradient>

    <linearGradient id="btnGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2563eb" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>

    <filter id="shadowGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="20" flood-color="#000000" flood-opacity="0.6" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="675" fill="url(#bgGrad)" />
  <rect width="1200" height="675" fill="url(#glowPurple)" />
  <rect width="1200" height="675" fill="url(#glowCyan)" />

  <!-- Subtle Grid Pattern -->
  <g opacity="0.12" stroke="#60a5fa" stroke-width="1">
    <line x1="0" y1="135" x2="1200" y2="135" />
    <line x1="0" y1="270" x2="1200" y2="270" />
    <line x1="0" y1="405" x2="1200" y2="405" />
    <line x1="0" y1="540" x2="1200" y2="540" />
    <line x1="240" y1="0" x2="240" y2="675" />
    <line x1="480" y1="0" x2="480" y2="675" />
    <line x1="720" y1="0" x2="720" y2="675" />
    <line x1="960" y1="0" x2="960" y2="675" />
  </g>

  <!-- Left Side Content -->
  <g transform="translate(80, 100)">
    <!-- Badge -->
    <g>
      <rect x="0" y="0" width="170" height="32" rx="16" fill="#1e293b" stroke="#3b82f6" stroke-width="1" stroke-opacity="0.4" />
      <circle cx="16" cy="16" r="4" fill="#3b82f6" />
      <text x="28" y="21" font-family="-apple-system, BlinkMacSystemFont, 'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="600" fill="#93c5fd" letter-spacing="1">UX CASE STUDY</text>
    </g>

    <!-- App Brand Tag -->
    <g transform="translate(0, 52)">
      <rect x="0" y="0" width="36" height="36" rx="8" fill="#2563eb" />
      <text x="7" y="24" font-family="-apple-system, BlinkMacSystemFont, 'Plus Jakarta Sans', sans-serif" font-size="16" font-weight="700" fill="#ffffff">B2</text>
      <text x="48" y="24" font-family="-apple-system, BlinkMacSystemFont, 'Plus Jakarta Sans', sans-serif" font-size="20" font-weight="700" fill="#f8fafc">Before Two</text>
    </g>

    <!-- Main Title -->
    <text x="0" y="150" font-family="Georgia, serif" font-size="48" font-weight="700" fill="#f8fafc" letter-spacing="-0.5">Ready before</text>
    <text x="0" y="205" font-family="Georgia, serif" font-size="48" font-weight="700" fill="#60a5fa" letter-spacing="-0.5">they arrive.</text>

    <!-- Subtitle -->
    <text x="0" y="260" font-family="-apple-system, BlinkMacSystemFont, 'Plus Jakarta Sans', sans-serif" font-size="16" fill="#94a3b8" width="460">
      <tspan x="0" dy="0">Proof-first housekeeping &amp; operations app for</tspan>
      <tspan x="0" dy="24">short-stay homes in India. Connecting host, housekeeper</tspan>
      <tspan x="0" dy="24">&amp; guest in one seamless workflow.</tspan>
    </text>

    <!-- Key Pills -->
    <g transform="translate(0, 350)">
      <g transform="translate(0, 0)">
        <rect width="115" height="32" rx="16" fill="#1e293b" />
        <text x="14" y="21" font-family="sans-serif" font-size="12" fill="#cbd5e1">Housekeeper</text>
      </g>
      <g transform="translate(125, 0)">
        <rect width="80" height="32" rx="16" fill="#1e293b" />
        <text x="14" y="21" font-family="sans-serif" font-size="12" fill="#cbd5e1">Guest</text>
      </g>
      <g transform="translate(215, 0)">
        <rect width="80" height="32" rx="16" fill="#1e293b" />
        <text x="14" y="21" font-family="sans-serif" font-size="12" fill="#cbd5e1">Host</text>
      </g>
      <g transform="translate(305, 0)">
        <rect width="130" height="32" rx="16" fill="#0369a1" fill-opacity="0.3" stroke="#0ea5e9" stroke-width="1" />
        <text x="14" y="21" font-family="sans-serif" font-size="12" font-weight="600" fill="#38bdf8">Read Case Study →</text>
      </g>
    </g>
  </g>

  <!-- Right Side Mockup UI Cards in 3D-like stacking -->
  <g transform="translate(680, 70)" filter="url(#shadowGlow)">
    
    <!-- Phone Mockup 1: Housekeeper App -->
    <g transform="translate(40, 30)">
      <!-- Outer Frame -->
      <rect width="250" height="490" rx="36" fill="#0f172a" stroke="#334155" stroke-width="6" />
      <rect width="238" height="478" x="6" y="6" rx="30" fill="#090d16" />
      
      <!-- Notch / Dynamic island -->
      <rect x="95" y="16" width="60" height="14" rx="7" fill="#1e293b" />
      
      <!-- Top Bar -->
      <text x="24" y="55" font-family="sans-serif" font-size="10" fill="#64748b">10:42 5G</text>
      <text x="24" y="76" font-family="sans-serif" font-size="11" fill="#94a3b8">Good morning</text>
      <text x="24" y="96" font-family="sans-serif" font-size="16" font-weight="700" fill="#f8fafc">Villa Aarav</text>
      
      <!-- Avatar -->
      <circle cx="215" cy="85" r="16" fill="#3b82f6" />
      <text x="210" y="90" font-family="sans-serif" font-size="13" font-weight="bold" fill="#ffffff">S</text>

      <!-- Task Card -->
      <g transform="translate(18, 120)">
        <rect width="214" height="180" rx="16" fill="#1e293b" stroke="#334155" stroke-width="1" />
        <text x="16" y="28" font-family="sans-serif" font-size="11" font-weight="600" fill="#94a3b8">Turnover Today</text>
        <text x="16" y="48" font-family="sans-serif" font-size="14" font-weight="700" fill="#ffffff">Villa Aarav</text>
        <text x="16" y="64" font-family="sans-serif" font-size="10" fill="#64748b">Baner, Pune</text>
        
        <!-- Times -->
        <line x1="16" y1="80" x2="198" y2="80" stroke="#334155" stroke-width="1" />
        <text x="16" y="98" font-family="sans-serif" font-size="10" fill="#94a3b8">Checkout</text>
        <text x="16" y="116" font-family="sans-serif" font-size="13" font-weight="700" fill="#38bdf8">11:00</text>

        <text x="120" y="98" font-family="sans-serif" font-size="10" fill="#94a3b8">Next arrival</text>
        <text x="120" y="116" font-family="sans-serif" font-size="13" font-weight="700" fill="#22c55e">15:00</text>

        <!-- Progress bar -->
        <rect x="16" y="136" width="182" height="6" rx="3" fill="#334155" />
        <rect x="16" y="136" width="60" height="6" rx="3" fill="#3b82f6" />
        <text x="16" y="160" font-family="sans-serif" font-size="10" fill="#64748b">0% done • 12 items</text>
      </g>

      <!-- Action Button -->
      <g transform="translate(18, 320)">
        <rect width="214" height="48" rx="12" fill="url(#btnGrad)" />
        <text x="90" y="30" font-family="sans-serif" font-size="15" font-weight="700" fill="#ffffff">Start</text>
      </g>

      <!-- Report Damage Secondary -->
      <g transform="translate(18, 380)">
        <rect width="214" height="40" rx="12" fill="#1e293b" stroke="#334155" stroke-width="1" />
        <text x="64" y="25" font-family="sans-serif" font-size="12" font-weight="600" fill="#e2e8f0">📷 Report damage</text>
      </g>
    </g>

    <!-- Phone Mockup 2: Host App (Floating on the right) -->
    <g transform="translate(240, 90)">
      <!-- Outer Frame -->
      <rect width="220" height="430" rx="32" fill="#0f172a" stroke="#475569" stroke-width="5" />
      <rect width="210" height="420" x="5" y="5" rx="26" fill="#0b101b" />
      
      <!-- Notch -->
      <rect x="80" y="14" width="50" height="12" rx="6" fill="#1e293b" />

      <!-- Top Bar -->
      <text x="20" y="48" font-family="sans-serif" font-size="9" fill="#64748b">10:42 5G</text>
      <text x="20" y="68" font-family="sans-serif" font-size="14" font-weight="700" fill="#f8fafc">Needs attention</text>
      
      <!-- Alert Card -->
      <g transform="translate(14, 80)">
        <rect width="182" height="70" rx="12" fill="#450a0a" stroke="#ef4444" stroke-width="1" />
        <text x="12" y="24" font-family="sans-serif" font-size="11" font-weight="700" fill="#fca5a5">Villa Aarav • Late</text>
        <text x="12" y="42" font-family="sans-serif" font-size="9.5" fill="#fecaca">Not started, 30 min late</text>
        <text x="12" y="58" font-family="sans-serif" font-size="9" font-weight="600" fill="#ef4444">Call Housekeeper →</text>
      </g>

      <!-- Active Turnover Card -->
      <g transform="translate(14, 160)">
        <rect width="182" height="80" rx="12" fill="#1e293b" stroke="#334155" stroke-width="1" />
        <circle cx="22" cy="22" r="4" fill="#22c55e" />
        <text x="32" y="26" font-family="sans-serif" font-size="11" font-weight="700" fill="#f8fafc">Casa Mira</text>
        <text x="12" y="44" font-family="sans-serif" font-size="9.5" fill="#94a3b8">Sunita • In progress</text>
        <rect x="12" y="54" width="158" height="5" rx="2.5" fill="#334155" />
        <rect x="12" y="54" width="110" height="5" rx="2.5" fill="#22c55e" />
        <text x="12" y="72" font-family="sans-serif" font-size="8.5" fill="#64748b">8 of 12 items done</text>
      </g>

      <!-- Ready Summary Card -->
      <g transform="translate(14, 250)">
        <rect width="182" height="44" rx="10" fill="#064e3b" stroke="#10b981" stroke-width="1" stroke-opacity="0.4" />
        <text x="12" y="27" font-family="sans-serif" font-size="10" font-weight="600" fill="#6ee7b7">✓ 5 homes ready for check-in</text>
      </g>

      <!-- Bottom Nav Bar -->
      <g transform="translate(14, 370)">
        <rect width="182" height="36" rx="18" fill="#1e293b" />
        <circle cx="36" cy="18" r="5" fill="#3b82f6" />
        <circle cx="78" cy="18" r="4" fill="#64748b" />
        <circle cx="118" cy="18" r="4" fill="#64748b" />
        <circle cx="154" cy="18" r="4" fill="#64748b" />
      </g>
    </g>

    <!-- Floating Badge: "Derived Readiness: Ready" -->
    <g transform="translate(10, 360)">
      <rect width="160" height="38" rx="19" fill="#0f172a" stroke="#22c55e" stroke-width="1.5" />
      <circle cx="20" cy="19" r="6" fill="#22c55e" />
      <text x="34" y="24" font-family="sans-serif" font-size="11" font-weight="700" fill="#f8fafc">Live Status: Ready</text>
    </g>
  </g>
</svg>
