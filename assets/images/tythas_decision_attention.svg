<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 680" width="100%" height="100%">
  <defs>
    <linearGradient id="atBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0c13" />
      <stop offset="100%" stop-color="#121828" />
    </linearGradient>
    <filter id="atShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.6" />
    </filter>
  </defs>

  <rect width="1200" height="680" fill="url(#atBg)" />

  <g transform="translate(60, 45)" filter="url(#atShadow)">
    <rect width="1080" height="590" rx="14" fill="#0f1422" stroke="#252f4a" stroke-width="1.5" />
    <rect width="1080" height="52" rx="14" fill="#161e31" />
    <circle cx="28" cy="26" r="5.5" fill="#ef4444" />
    <circle cx="48" cy="26" r="5.5" fill="#f59e0b" />
    <circle cx="68" cy="26" r="5.5" fill="#10b981" />
    <text x="100" y="30" font-family="'Plus Jakarta Sans', sans-serif" font-size="13" font-weight="600" fill="#cbd5e1">Tythas Control Center · Priority Attention Queue — Multi-Tenant Operational Triage</text>

    <!-- Header Filter & Metrics Row -->
    <g transform="translate(40, 75)">
      <!-- Filter Chips -->
      <rect x="0" y="0" width="90" height="32" rx="16" fill="#6366f1" />
      <text x="18" y="20" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="700" fill="#ffffff">All (5)</text>

      <rect x="100" y="0" width="125" height="32" rx="16" fill="rgba(239, 68, 68, 0.15)" stroke="#ef4444" stroke-width="1" />
      <circle cx="116" cy="16" r="4" fill="#ef4444" />
      <text x="126" y="20" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="700" fill="#fca5a5">Critical (1)</text>

      <rect x="235" y="0" width="130" height="32" rx="16" fill="rgba(245, 158, 11, 0.15)" stroke="#f59e0b" stroke-width="1" />
      <circle cx="251" cy="16" r="4" fill="#f59e0b" />
      <text x="261" y="20" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="700" fill="#fde047">Warnings (2)</text>

      <rect x="375" y="0" width="115" height="32" rx="16" fill="rgba(16, 185, 129, 0.15)" stroke="#10b981" stroke-width="1" />
      <circle cx="391" cy="16" r="4" fill="#10b981" />
      <text x="401" y="20" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="700" fill="#6ee7b7">Leads (2)</text>

      <rect x="880" y="0" width="120" height="32" rx="6" fill="#1a233a" stroke="#2e3c5d" />
      <text x="898" y="20" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="600" fill="#cbd5e1">Mark All Read</text>
    </g>

    <!-- Queue Items List -->
    <g transform="translate(40, 130)">
      <!-- Item 1: Critical Uptime (Red) -->
      <g transform="translate(0, 0)">
        <rect width="1000" height="90" rx="10" fill="#161c2d" stroke="#ef4444" stroke-width="1.2" />
        <rect x="0" y="0" width="6" height="90" rx="3" fill="#ef4444" />
        <rect x="24" y="22" width="68" height="22" rx="4" fill="rgba(239, 68, 68, 0.2)" />
        <text x="32" y="37" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="800" fill="#f87171">CRITICAL</text>
        <text x="105" y="38" font-family="'Plus Jakarta Sans', sans-serif" font-size="14" font-weight="700" fill="#ffffff">SSL Certificate Expiring in 48 Hours</text>
        <rect x="420" y="22" width="130" height="22" rx="4" fill="#1f283f" />
        <text x="432" y="37" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="600" fill="#94a3b8">Tenant: SaCreations.in</text>
        <text x="24" y="66" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" fill="#94a3b8">Let's Encrypt automated challenge renewal failed due to DNS record drift. Requires TXT verify.</text>
        <rect x="870" y="28" width="105" height="34" rx="6" fill="#ef4444" />
        <text x="888" y="49" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="700" fill="#ffffff">Renew SSL →</text>
      </g>

      <!-- Item 2: Lead Submission (Green) -->
      <g transform="translate(0, 105)">
        <rect width="1000" height="90" rx="10" fill="#161c2d" stroke="#10b981" stroke-width="1.2" />
        <rect x="0" y="0" width="6" height="90" rx="3" fill="#10b981" />
        <rect x="24" y="22" width="80" height="22" rx="4" fill="rgba(16, 185, 129, 0.2)" />
        <text x="32" y="37" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="800" fill="#34d399">NEW LEAD</text>
        <text x="116" y="38" font-family="'Plus Jakarta Sans', sans-serif" font-size="14" font-weight="700" fill="#ffffff">Inbound Enterprise Quote Request ($15,000 budget)</text>
        <rect x="530" y="22" width="130" height="22" rx="4" fill="#1f283f" />
        <text x="542" y="37" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="600" fill="#94a3b8">Tenant: Tythas.agency</text>
        <text x="24" y="66" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" fill="#94a3b8">Submitted from `/contact` via Google Ads Campaign [B2B-SaaS-Pune]. Lead auto-assigned to Founder.</text>
        <rect x="870" y="28" width="105" height="34" rx="6" fill="#10b981" />
        <text x="886" y="49" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="700" fill="#ffffff">View Lead →</text>
      </g>

      <!-- Item 3: Warning SEO (Yellow) -->
      <g transform="translate(0, 210)">
        <rect width="1000" height="90" rx="10" fill="#161c2d" stroke="#f59e0b" stroke-width="1.2" />
        <rect x="0" y="0" width="6" height="90" rx="3" fill="#f59e0b" />
        <rect x="24" y="22" width="70" height="22" rx="4" fill="rgba(245, 158, 11, 0.2)" />
        <text x="32" y="37" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="800" fill="#fbbf24">WARNING</text>
        <text x="106" y="38" font-family="'Plus Jakarta Sans', sans-serif" font-size="14" font-weight="700" fill="#ffffff">Missing Canonical &amp; OpenGraph Meta on 4 New Articles</text>
        <rect x="540" y="22" width="140" height="22" rx="4" fill="#1f283f" />
        <text x="552" y="37" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="600" fill="#94a3b8">Tenant: MandalStores.com</text>
        <text x="24" y="66" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" fill="#94a3b8">Blog posts published without social thumbnail metadata. Automated fallback generator available.</text>
        <rect x="870" y="28" width="105" height="34" rx="6" fill="#24304c" stroke="#3b4b73" />
        <text x="888" y="49" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="700" fill="#c7d2fe">Auto-Fix →</text>
      </g>

      <!-- Item 4: Telemetry Info (Indigo) -->
      <g transform="translate(0, 315)">
        <rect width="1000" height="90" rx="10" fill="#161c2d" stroke="#252f48" stroke-width="1" />
        <rect x="0" y="0" width="6" height="90" rx="3" fill="#6366f1" />
        <rect x="24" y="22" width="90" height="22" rx="4" fill="rgba(99, 102, 241, 0.2)" />
        <text x="32" y="37" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="800" fill="#818cf8">SCHEDULED</text>
        <text x="126" y="38" font-family="'Plus Jakarta Sans', sans-serif" font-size="14" font-weight="700" fill="#ffffff">Weekly XML Sitemap Ping &amp; Core Web Vitals Audit Complete</text>
        <rect x="620" y="22" width="120" height="22" rx="4" fill="#1f283f" />
        <text x="632" y="37" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="600" fill="#94a3b8">All 6 Tenant Sites</text>
        <text x="24" y="66" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" fill="#94a3b8">Average LCP across client sites: 1.2s. Zero indexing regressions discovered this week.</text>
        <rect x="870" y="28" width="105" height="34" rx="6" fill="#1b2338" />
        <text x="898" y="49" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="600" fill="#94a3b8">Dismiss</text>
      </g>
    </g>
  </g>
</svg>
