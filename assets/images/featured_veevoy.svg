<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="100%" height="100%">
  <defs>
    <!-- Background Gradient (Lavender / Pink / Violet glow) -->
    <linearGradient id="bg-veevoy-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#D8B4E2"/>
      <stop offset="35%" stop-color="#E9D5FF"/>
      <stop offset="70%" stop-color="#F5D0E3"/>
      <stop offset="100%" stop-color="#C4B5FD"/>
    </linearGradient>

    <!-- Radial Soft Lighting Spots -->
    <radialGradient id="light-spot-1" cx="80%" cy="20%" r="40%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="light-spot-2" cx="15%" cy="80%" r="50%">
      <stop offset="0%" stop-color="#E879F9" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#E879F9" stop-opacity="0"/>
    </radialGradient>

    <filter id="shadow-device" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="25" stdDeviation="35" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="1600" height="900" fill="url(#bg-veevoy-grad)"/>
  <rect width="1600" height="900" fill="url(#light-spot-1)"/>
  <rect width="1600" height="900" fill="url(#light-spot-2)"/>

  <!-- Elegant Swirling Contour Line Art (Left Side) -->
  <g fill="none" stroke="#2D253B" stroke-width="1.2" opacity="0.35">
    <path d="M -100,100 C 200,50 150,450 350,550 C 500,620 520,300 680,250 C 800,210 750,700 950,850"/>
    <path d="M -100,140 C 220,90 170,470 370,570 C 520,640 540,320 700,270 C 820,230 770,720 970,870"/>
    <path d="M -100,180 C 240,130 190,490 390,590 C 540,660 560,340 720,290 C 840,250 790,740 990,890"/>
    <path d="M -100,220 C 260,170 210,510 410,610 C 560,680 580,360 740,310 C 860,270 810,760 1010,910"/>
    <path d="M -100,260 C 280,210 230,530 430,630 C 580,700 600,380 760,330 C 880,290 830,780 1030,930"/>
    <path d="M -100,300 C 300,250 250,550 450,650 C 600,720 620,400 780,350 C 900,310 850,800 1050,950"/>
  </g>

  <!-- Elegant Swirling Contour Line Art (Right Side) -->
  <g fill="none" stroke="#2D253B" stroke-width="1.2" opacity="0.35">
    <path d="M 650,-50 C 850,150 900,450 1100,480 C 1300,510 1350,200 1500,250 C 1600,280 1650,650 1750,850"/>
    <path d="M 670,-30 C 870,170 920,470 1120,500 C 1320,530 1370,220 1520,270 C 1620,300 1670,670 1770,870"/>
    <path d="M 690,-10 C 890,190 940,490 1140,520 C 1340,550 1390,240 1540,290 C 1640,320 1690,690 1790,890"/>
    <path d="M 710,10 C 910,210 960,510 1160,540 C 1360,570 1410,260 1560,310 C 1660,340 1710,710 1810,910"/>
    <path d="M 730,30 C 930,230 980,530 1180,560 C 1380,590 1430,280 1580,330 C 1680,360 1730,730 1830,930"/>
  </g>

  <!-- Center Web App Dashboard Canvas (Floating Laptop / Browser Window Mockup) -->
  <g transform="translate(420, 140)" filter="url(#shadow-device)">
    <!-- Browser Window Shell -->
    <rect width="760" height="520" rx="14" fill="#14161D" stroke="rgba(255,255,255,0.18)" stroke-width="2"/>
    
    <!-- Window Bar -->
    <rect width="760" height="42" rx="14" fill="#1C1F28"/>
    <rect y="30" width="760" height="12" fill="#1C1F28"/>
    <circle cx="25" cy="21" r="5" fill="#ff5f56"/>
    <circle cx="42" cy="21" r="5" fill="#ffbd2e"/>
    <circle cx="59" cy="21" r="5" fill="#27c93f"/>
    <rect x="95" y="12" width="280" height="18" rx="9" fill="rgba(255,255,255,0.08)"/>
    <text x="235" y="25" fill="rgba(255,255,255,0.45)" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" text-anchor="middle" letter-spacing="0.04em">veevoy.app/dashboard</text>

    <!-- Sidebar -->
    <rect x="0" y="42" width="160" height="478" fill="#101218"/>
    <line x1="160" y1="42" x2="160" y2="520" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
    
    <!-- Sidebar items -->
    <rect x="20" y="65" width="85" height="10" rx="3" fill="#C4B5FD" opacity="0.8"/>
    <rect x="20" y="95" width="120" height="26" rx="6" fill="rgba(196, 181, 253, 0.15)"/>
    <rect x="20" y="135" width="100" height="8" rx="3" fill="rgba(255,255,255,0.15)"/>
    <rect x="20" y="155" width="80" height="8" rx="3" fill="rgba(255,255,255,0.15)"/>
    <rect x="20" y="175" width="110" height="8" rx="3" fill="rgba(255,255,255,0.15)"/>

    <!-- Main Content Area -->
    <rect x="185" y="65" width="220" height="16" rx="4" fill="rgba(255,255,255,0.35)"/>
    <rect x="185" y="92" width="300" height="8" rx="3" fill="rgba(255,255,255,0.15)"/>

    <!-- KPI Metric Cards Row -->
    <g transform="translate(185, 120)">
      <rect width="170" height="85" rx="8" fill="#1B1E27" stroke="rgba(255,255,255,0.06)"/>
      <rect x="15" y="15" width="60" height="7" rx="3" fill="rgba(255,255,255,0.25)"/>
      <rect x="15" y="32" width="95" height="18" rx="4" fill="#C4B5FD" opacity="0.9"/>
      <rect x="15" y="58" width="50" height="6" rx="2" fill="#34D399" opacity="0.8"/>

      <rect x="185" width="170" height="85" rx="8" fill="#1B1E27" stroke="rgba(255,255,255,0.06)"/>
      <rect x="200" y="15" width="60" height="7" rx="3" fill="rgba(255,255,255,0.25)"/>
      <rect x="200" y="32" width="95" height="18" rx="4" fill="#FFFFFF" opacity="0.85"/>
      <rect x="200" y="58" width="50" height="6" rx="2" fill="#38BDF8" opacity="0.8"/>

      <rect x="370" width="170" height="85" rx="8" fill="#1B1E27" stroke="rgba(255,255,255,0.06)"/>
      <rect x="385" y="15" width="60" height="7" rx="3" fill="rgba(255,255,255,0.25)"/>
      <rect x="385" y="32" width="95" height="18" rx="4" fill="#F472B6" opacity="0.9"/>
      <rect x="385" y="58" width="50" height="6" rx="2" fill="#34D399" opacity="0.8"/>
    </g>

    <!-- Main Chart / Visualization Panel -->
    <g transform="translate(185, 225)">
      <rect width="545" height="265" rx="10" fill="#191B24" stroke="rgba(255,255,255,0.06)"/>
      <rect x="20" y="20" width="140" height="10" rx="3" fill="rgba(255,255,255,0.3)"/>
      
      <!-- Chart lines -->
      <path d="M 40 210 Q 120 140, 200 170 T 360 110 T 500 70" fill="none" stroke="#C4B5FD" stroke-width="3.5"/>
      <path d="M 40 210 Q 120 140, 200 170 T 360 110 T 500 70 L 500 240 L 40 240 Z" fill="url(#bg-veevoy-grad)" opacity="0.15"/>
      
      <!-- Data points -->
      <circle cx="200" cy="170" r="5" fill="#C4B5FD"/>
      <circle cx="360" cy="110" r="5" fill="#C4B5FD"/>
      <circle cx="500" cy="70" r="6" fill="#FFFFFF" stroke="#C4B5FD" stroke-width="2"/>
    </g>
  </g>

  <!-- Reflection Gradient at bottom -->
  <rect y="720" width="1600" height="180" fill="linear-gradient(to bottom, rgba(196,181,253,0) 0%, rgba(216,180,226,0.5) 100%)"/>
</svg>
