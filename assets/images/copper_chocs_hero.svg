<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1200 675" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgWarmGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2a1413" />
      <stop offset="45%" stop-color="#1f0f0e" />
      <stop offset="100%" stop-color="#130808" />
    </linearGradient>

    <radialGradient id="glowBerry" cx="25%" cy="35%" r="55%">
      <stop offset="0%" stop-color="#9a3839" stop-opacity="0.35" />
      <stop offset="60%" stop-color="#9a3839" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#9a3839" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="glowBlush" cx="82%" cy="65%" r="60%">
      <stop offset="0%" stop-color="#ecbeb9" stop-opacity="0.22" />
      <stop offset="50%" stop-color="#f7d2c6" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#f7d2c6" stop-opacity="0" />
    </radialGradient>

    <linearGradient id="berryBtnGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#9a3839" />
      <stop offset="100%" stop-color="#b64648" />
    </linearGradient>

    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2d1716" stop-opacity="0.92" />
      <stop offset="100%" stop-color="#1b0d0c" stop-opacity="0.96" />
    </linearGradient>

    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f5d0a9" />
      <stop offset="100%" stop-color="#d49b6a" />
    </linearGradient>

    <filter id="laptopShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="28" flood-color="#000000" flood-opacity="0.75" />
    </filter>

    <filter id="floatCardShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.55" />
    </filter>

    <clipPath id="laptopScreenClip">
      <rect x="0" y="0" width="530" height="336" rx="8" />
    </clipPath>
  </defs>

  <!-- Background Base -->
  <rect width="1200" height="675" fill="url(#bgWarmGrad)" />
  <rect width="1200" height="675" fill="url(#glowBerry)" />
  <rect width="1200" height="675" fill="url(#glowBlush)" />

  <!-- Subtle Bakery Grain Lines -->
  <g opacity="0.07" stroke="#f7d2c6" stroke-width="1">
    <line x1="0" y1="135" x2="1200" y2="135" />
    <line x1="0" y1="270" x2="1200" y2="270" />
    <line x1="0" y1="405" x2="1200" y2="405" />
    <line x1="0" y1="540" x2="1200" y2="540" />
    <line x1="240" y1="0" x2="240" y2="675" />
    <line x1="480" y1="0" x2="480" y2="675" />
    <line x1="720" y1="0" x2="720" y2="675" />
    <line x1="960" y1="0" x2="960" y2="675" />
  </g>

  <!-- LEFT HERO TYPOGRAPHY & META -->
  <g transform="translate(75, 80)">
    
    <!-- Top Eyebrow Badges -->
    <g>
      <rect x="0" y="0" width="220" height="32" rx="16" fill="#3a1c1b" stroke="#9a3839" stroke-width="1" stroke-opacity="0.5" />
      <circle cx="16" cy="16" r="4" fill="#ecbeb9" />
      <text x="28" y="21" font-family="-apple-system, BlinkMacSystemFont, 'Plus Jakarta Sans', sans-serif" font-size="11.5" font-weight="700" fill="#f7d2c6" letter-spacing="1.2">CASE STUDY · E-COMMERCE</text>
    </g>

    <!-- App / Brand Identity Tag -->
    <g transform="translate(0, 50)">
      <rect x="0" y="0" width="38" height="38" rx="10" fill="#9a3839" />
      <text x="9" y="25" font-family="-apple-system, BlinkMacSystemFont, 'Plus Jakarta Sans', sans-serif" font-size="16" font-weight="800" fill="#ffffff">CC</text>
      <text x="52" y="25" font-family="-apple-system, BlinkMacSystemFont, 'Plus Jakarta Sans', sans-serif" font-size="21" font-weight="700" fill="#fff5f2">Copper Chocs</text>
      <text x="210" y="25" font-family="Georgia, serif" font-size="14" font-style="italic" fill="#ecbeb9">• Pune 1995</text>
    </g>

    <!-- Headline (Display Serif) -->
    <text x="0" y="145" font-family="Newsreader, Georgia, serif" font-size="46" font-weight="400" fill="#fff5f2" letter-spacing="-0.5">A 1995 Pune bakery,</text>
    <text x="0" y="200" font-family="Newsreader, Georgia, serif" font-size="46" font-weight="400" font-style="italic" fill="#f7d2c6" letter-spacing="-0.5">redesigned to sell online.</text>

    <!-- Subtitle -->
    <text x="0" y="252" font-family="-apple-system, BlinkMacSystemFont, 'Plus Jakarta Sans', sans-serif" font-size="15.5" fill="#d1b8b4" line-height="24">
      <tspan x="0" dy="0">A Shopify store that lets customers order a cake, customise</tspan>
      <tspan x="0" dy="24">one for an occasion, or find one of 15 Pune outlets in</tspan>
      <tspan x="0" dy="24">under a minute.</tspan>
    </text>

    <!-- Pills Row -->
    <g transform="translate(0, 340)">
      <g transform="translate(0, 0)">
        <rect width="145" height="32" rx="16" fill="#311918" stroke="#542826" stroke-width="1" />
        <text x="14" y="20.5" font-family="sans-serif" font-size="11.5" font-weight="600" fill="#f7d2c6">UI/UX · End-to-End</text>
      </g>
      <g transform="translate(155, 0)">
        <rect width="85" height="32" rx="16" fill="#311918" stroke="#542826" stroke-width="1" />
        <text x="14" y="20.5" font-family="sans-serif" font-size="11.5" font-weight="600" fill="#f7d2c6">Shopify</text>
      </g>
      <g transform="translate(250, 0)">
        <rect width="110" height="32" rx="16" fill="#311918" stroke="#542826" stroke-width="1" />
        <text x="14" y="20.5" font-family="sans-serif" font-size="11.5" font-weight="600" fill="#f7d2c6">Desktop Web</text>
      </g>
      <g transform="translate(370, 0)">
        <rect width="125" height="32" rx="16" fill="#9a3839" fill-opacity="0.35" stroke="#9a3839" stroke-width="1" />
        <text x="14" y="20.5" font-family="sans-serif" font-size="11.5" font-weight="700" fill="#ffffff">The Impact Engine</text>
      </g>
    </g>

    <!-- Stats Matrix (Mini scannable metrics) -->
    <g transform="translate(0, 400)">
      <!-- Box 1: 1995 -->
      <g transform="translate(0, 0)">
        <rect width="112" height="66" rx="12" fill="#251211" stroke="#3d1d1c" stroke-width="1" />
        <text x="14" y="30" font-family="sans-serif" font-size="20" font-weight="800" fill="#ffffff">1995</text>
        <text x="14" y="48" font-family="sans-serif" font-size="10.5" font-weight="500" fill="#ecbeb9">baking since</text>
      </g>
      <!-- Box 2: 15 Outlets -->
      <g transform="translate(124, 0)">
        <rect width="112" height="66" rx="12" fill="#251211" stroke="#3d1d1c" stroke-width="1" />
        <text x="14" y="30" font-family="sans-serif" font-size="20" font-weight="800" fill="#ffffff">15</text>
        <text x="14" y="48" font-family="sans-serif" font-size="10.5" font-weight="500" fill="#ecbeb9">outlets in Pune</text>
      </g>
      <!-- Box 3: 6 Templates -->
      <g transform="translate(248, 0)">
        <rect width="112" height="66" rx="12" fill="#251211" stroke="#3d1d1c" stroke-width="1" />
        <text x="14" y="30" font-family="sans-serif" font-size="20" font-weight="800" fill="#ffffff">6</text>
        <text x="14" y="48" font-family="sans-serif" font-size="10.5" font-weight="500" fill="#ecbeb9">templates</text>
      </g>
      <!-- Box 4: 3 Paths -->
      <g transform="translate(372, 0)">
        <rect width="112" height="66" rx="12" fill="#251211" stroke="#3d1d1c" stroke-width="1" />
        <text x="14" y="30" font-family="sans-serif" font-size="20" font-weight="800" fill="#ffffff">&lt; 1 min</text>
        <text x="14" y="48" font-family="sans-serif" font-size="10.5" font-weight="500" fill="#ecbeb9">order time</text>
      </g>
    </g>

    <!-- Live site button -->
    <g transform="translate(0, 485)">
      <rect width="180" height="40" rx="20" fill="url(#berryBtnGrad)" />
      <text x="24" y="25" font-family="sans-serif" font-size="13" font-weight="700" fill="#ffffff">copperchocs.com ↗</text>
    </g>

  </g>

  <!-- RIGHT SIDE: DESKTOP STOREFRONT MOCKUP & FLOATING CARDS -->
  <g transform="translate(595, 75)" filter="url(#laptopShadow)">
    
    <!-- MacBook / Desktop Display Shell -->
    <rect width="560" height="375" rx="16" fill="#1e1010" stroke="#4a2420" stroke-width="3" />
    
    <!-- Camera Dot & Notch Frame -->
    <circle cx="280" cy="11" r="3.5" fill="#3a1c1a" />
    <circle cx="280" cy="11" r="1.5" fill="#120606" />

    <!-- Browser Screen Container -->
    <g transform="translate(15, 22)">
      <rect width="530" height="336" rx="8" fill="#fff9f7" />
      
      <!-- Embedded Showcase Photo or Vector Storefront fallback -->
      <g clip-path="url(#laptopScreenClip)">
        <image href="copper_chocs_showcase.jpg" xlink:href="copper_chocs_showcase.jpg" x="0" y="0" width="530" height="336" preserveAspectRatio="xMidYMid slice" />
        
        <!-- Subtle Storefront Overlay Header -->
        <rect width="530" height="52" fill="#241110" fill-opacity="0.94" />
        <text x="20" y="32" font-family="Newsreader, Georgia, serif" font-size="18" font-weight="700" fill="#ffffff">Copper Chocs</text>
        <text x="150" y="31" font-family="sans-serif" font-size="10.5" fill="#f7d2c6" letter-spacing="0.5">CAKES</text>
        <text x="210" y="31" font-family="sans-serif" font-size="10.5" fill="#f7d2c6" letter-spacing="0.5">PASTRIES</text>
        <text x="285" y="31" font-family="sans-serif" font-size="10.5" fill="#f7d2c6" letter-spacing="0.5">CUSTOMIZE</text>
        <text x="375" y="31" font-family="sans-serif" font-size="10.5" fill="#f7d2c6" letter-spacing="0.5">FIND US (15)</text>
        <rect x="460" y="16" width="54" height="24" rx="12" fill="#9a3839" />
        <text x="473" y="32" font-family="sans-serif" font-size="10" font-weight="700" fill="#ffffff">CART 0</text>

        <!-- Hero Banner Content on Store -->
        <g transform="translate(20, 75)">
          <rect width="260" height="115" rx="12" fill="#1c0b0a" fill-opacity="0.82" />
          <text x="16" y="28" font-family="Newsreader, Georgia, serif" font-size="16" font-style="italic" fill="#ecbeb9">Creating Memories,</text>
          <text x="16" y="48" font-family="sans-serif" font-size="18" font-weight="800" fill="#ffffff">Crafted With Love</text>
          <text x="16" y="68" font-family="sans-serif" font-size="10" fill="#d1b8b4">Celebrating 25+ years of pure indulgence</text>
          <rect x="16" y="80" width="95" height="24" rx="12" fill="#9a3839" />
          <text x="32" y="96" font-family="sans-serif" font-size="10" font-weight="700" fill="#ffffff">Order Now →</text>
        </g>
      </g>
    </g>

    <!-- Laptop Base Stand -->
    <path d="M210 375 L350 375 L365 385 L195 385 Z" fill="#2d1716" />
    <rect x="170" y="384" width="220" height="4" rx="2" fill="#4a2420" />
  </g>

  <!-- FLOATING CARD 1: PURCHASE DECISION PANEL (Eggless + Weight) -->
  <g transform="translate(565, 390)" filter="url(#floatCardShadow)">
    <rect width="290" height="175" rx="16" fill="#1f0f0e" stroke="#4a2420" stroke-width="1.5" />
    <g transform="translate(18, 16)">
      <!-- Title -->
      <text x="0" y="16" font-family="sans-serif" font-size="12" font-weight="700" fill="#ffffff">Decisions on Product Page</text>
      <text x="0" y="32" font-family="sans-serif" font-size="10" fill="#ecbeb9">Answer every doubt before "Add to cart"</text>
      
      <!-- Weight Pills -->
      <text x="0" y="55" font-family="sans-serif" font-size="9.5" font-weight="600" fill="#a8908d">Weight Options</text>
      <rect x="0" y="63" width="62" height="24" rx="12" fill="#9a3839" />
      <text x="14" y="79" font-family="sans-serif" font-size="10" font-weight="700" fill="#ffffff">½ Kg</text>
      <rect x="68" y="63" width="62" height="24" rx="12" fill="#2a1413" stroke="#4a2420" stroke-width="1" />
      <text x="86" y="79" font-family="sans-serif" font-size="10" fill="#d1b8b4">1 Kg</text>

      <!-- Egg Toggle -->
      <g transform="translate(150, 44)">
        <text x="0" y="11" font-family="sans-serif" font-size="9.5" font-weight="600" fill="#a8908d">100% Eggless</text>
        <rect x="0" y="19" width="46" height="24" rx="12" fill="#22c55e" />
        <circle cx="34" cy="31" r="9" fill="#ffffff" />
      </g>

      <!-- Delivery Check & CTA -->
      <g transform="translate(0, 100)">
        <rect width="254" height="34" rx="10" fill="url(#berryBtnGrad)" />
        <text x="80" y="22" font-family="sans-serif" font-size="12" font-weight="700" fill="#ffffff">🛒 Add to Cart</text>
      </g>
    </g>
  </g>

  <!-- FLOATING CARD 2: 15-OUTLET LOCATOR ( Jakob's & Fitts's Law ) -->
  <g transform="translate(880, 370)" filter="url(#floatCardShadow)">
    <rect width="260" height="200" rx="16" fill="#1f0f0e" stroke="#4a2420" stroke-width="1.5" />
    <g transform="translate(18, 18)">
      <rect x="0" y="0" width="85" height="20" rx="10" fill="#9a3839" fill-opacity="0.25" stroke="#9a3839" stroke-width="0.8" />
      <text x="10" y="14" font-family="sans-serif" font-size="9" font-weight="700" fill="#ecbeb9">STORE FINDER</text>
      <text x="0" y="40" font-family="sans-serif" font-size="14" font-weight="700" fill="#ffffff">Find Us in Pune</text>
      <text x="0" y="55" font-family="sans-serif" font-size="10" fill="#a8908d">15 outlets across the city</text>

      <!-- Outlet Mini Card -->
      <g transform="translate(0, 70)">
        <rect width="224" height="52" rx="10" fill="#2a1413" stroke="#3d1d1c" stroke-width="1" />
        <circle cx="20" cy="26" r="10" fill="#9a3839" />
        <text x="16" y="30" font-family="sans-serif" font-size="10" font-weight="800" fill="#ffffff">📍</text>
        <text x="38" y="20" font-family="sans-serif" font-size="11" font-weight="700" fill="#ffffff">Baner, Pune</text>
        <text x="38" y="34" font-family="sans-serif" font-size="9.5" fill="#22c55e">Open Now • 10 AM–10 PM</text>
        <text x="38" y="46" font-family="sans-serif" font-size="9" fill="#ecbeb9">Directions · Call · Order</text>
      </g>

      <!-- Trust Badges -->
      <g transform="translate(0, 134)">
        <text x="0" y="14" font-family="sans-serif" font-size="9" fill="#d1b8b4">✓ Freshly Baked Daily</text>
        <text x="115" y="14" font-family="sans-serif" font-size="9" fill="#d1b8b4">✓ Same-Day Delivery</text>
      </g>
    </g>
  </g>

</svg>
