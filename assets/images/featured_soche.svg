<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="100%" height="100%">
  <defs>
    <!-- Background Gradient (Rose / Plum / Lavender luxury vibe) -->
    <linearGradient id="bg-soche-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E2C2D6"/>
      <stop offset="40%" stop-color="#ECD4E4"/>
      <stop offset="75%" stop-color="#DBC4F0"/>
      <stop offset="100%" stop-color="#C7B2E9"/>
    </linearGradient>

    <!-- Radial Soft Lighting Spots -->
    <radialGradient id="light-spot-soche-1" cx="20%" cy="25%" r="45%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="light-spot-soche-2" cx="85%" cy="75%" r="50%">
      <stop offset="0%" stop-color="#F472B6" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#F472B6" stop-opacity="0"/>
    </radialGradient>

    <filter id="shadow-phone-soche" x="-25%" y="-20%" width="150%" height="140%">
      <feDropShadow dx="0" dy="30" stdDeviation="40" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="1600" height="900" fill="url(#bg-soche-grad)"/>
  <rect width="1600" height="900" fill="url(#light-spot-soche-1)"/>
  <rect width="1600" height="900" fill="url(#light-spot-soche-2)"/>

  <!-- Organic Swirling Waves (Top Left to Bottom Right) -->
  <g fill="none" stroke="#261E2E" stroke-width="1.2" opacity="0.32">
    <path d="M -80,50 C 220,10 180,480 400,520 C 580,560 620,220 800,280 C 980,340 920,820 1150,920"/>
    <path d="M -80,90 C 240,50 200,500 420,540 C 600,580 640,240 820,300 C 1000,360 940,840 1170,940"/>
    <path d="M -80,130 C 260,90 220,520 440,560 C 620,600 660,260 840,320 C 1020,380 960,860 1190,960"/>
    <path d="M -80,170 C 280,130 240,540 460,580 C 640,620 680,280 860,340 C 1040,400 980,880 1210,980"/>
    <path d="M -80,210 C 300,170 260,560 480,600 C 660,640 700,300 880,360 C 1060,420 1000,900 1230,1000"/>
  </g>

  <!-- Swirling Waves (Right Side) -->
  <g fill="none" stroke="#261E2E" stroke-width="1.2" opacity="0.32">
    <path d="M 850,-60 C 1050,140 1120,440 1280,470 C 1440,500 1480,180 1620,240 C 1720,280 1760,650 1850,850"/>
    <path d="M 870,-40 C 1070,160 1140,460 1300,490 C 1460,520 1500,200 1640,260 C 1740,300 1780,670 1870,870"/>
    <path d="M 890,-20 C 1090,180 1160,480 1320,510 C 1480,540 1520,220 1660,280 C 1760,320 1800,690 1890,890"/>
    <path d="M 910,0 C 1110,200 1180,500 1340,530 C 1500,560 1540,240 1680,300 C 1780,340 1820,710 1910,910"/>
  </g>

  <!-- Centered Luxury Phone / Screen Device Mockup -->
  <g transform="translate(635, 110)" filter="url(#shadow-phone-soche)">
    <!-- Phone Bezel Outer -->
    <rect width="330" height="680" rx="42" fill="#0C0E12" stroke="#4A4E5A" stroke-width="3.5"/>
    <rect x="5" y="5" width="320" height="670" rx="38" fill="#181A22"/>
    
    <!-- Phone Screen Inner -->
    <rect x="12" y="12" width="306" height="656" rx="32" fill="#121318"/>

    <!-- Dynamic Island / Speaker notch -->
    <rect x="115" y="24" width="100" height="22" rx="11" fill="#000000"/>
    <circle cx="195" cy="35" r="4.5" fill="#1a1c24"/>

    <!-- Screen Content: Soché Luxury Fashion & Editorial UI -->
    <g transform="translate(24, 60)">
      <!-- Top Brand Header -->
      <text x="141" y="26" fill="#F8F9FA" font-family="'Newsreader', Georgia, serif" font-size="20" font-weight="400" font-style="italic" text-anchor="middle" letter-spacing="0.1em">SOCHÉ</text>
      <text x="141" y="44" fill="rgba(255,255,255,0.4)" font-family="'Plus Jakarta Sans', sans-serif" font-size="7.5" font-weight="600" text-anchor="middle" letter-spacing="0.2em">COLLECTION 2026</text>
      
      <!-- Hero Editorial Image Block -->
      <g transform="translate(0, 60)">
        <rect width="282" height="320" rx="16" fill="#20222C"/>
        <!-- Abstract gradient silhouette in image -->
        <rect width="282" height="320" rx="16" fill="linear-gradient(180deg, rgba(196,181,253,0.2) 0%, rgba(244,114,182,0.15) 50%, rgba(18,19,24,0.9) 100%)"/>
        
        <circle cx="141" cy="140" r="60" fill="rgba(255,255,255,0.08)" stroke="rgba(255,255,255,0.15)" stroke-width="1.5"/>
        <path d="M 90 200 Q 141 120, 192 200" fill="none" stroke="#C4B5FD" stroke-width="2" opacity="0.6"/>

        <text x="141" y="270" fill="#FFFFFF" font-family="'Newsreader', Georgia, serif" font-size="18" font-weight="300" text-anchor="middle">Form &amp; Sensibility</text>
        <text x="141" y="292" fill="#C4B5FD" font-family="'Plus Jakarta Sans', sans-serif" font-size="8" font-weight="600" text-anchor="middle" letter-spacing="0.15em">EXPLORE CAPSULE — 04</text>
      </g>

      <!-- Bottom Card Grid -->
      <g transform="translate(0, 400)">
        <rect width="135" height="150" rx="12" fill="#1C1E26" stroke="rgba(255,255,255,0.05)"/>
        <rect x="12" y="12" width="111" height="85" rx="8" fill="rgba(255,255,255,0.06)"/>
        <rect x="12" y="108" width="70" height="8" rx="2" fill="rgba(255,255,255,0.3)"/>
        <rect x="12" y="124" width="45" height="8" rx="2" fill="#C4B5FD" opacity="0.7"/>

        <rect x="147" width="135" height="150" rx="12" fill="#1C1E26" stroke="rgba(255,255,255,0.05)"/>
        <rect x="159" y="12" width="111" height="85" rx="8" fill="rgba(255,255,255,0.06)"/>
        <rect x="159" y="108" width="70" height="8" rx="2" fill="rgba(255,255,255,0.3)"/>
        <rect x="159" y="124" width="45" height="8" rx="2" fill="#C4B5FD" opacity="0.7"/>
      </g>
    </g>
  </g>

  <!-- Reflection Gradient at bottom -->
  <rect y="750" width="1600" height="150" fill="linear-gradient(to bottom, rgba(196,181,253,0) 0%, rgba(226,194,214,0.5) 100%)"/>
</svg>
