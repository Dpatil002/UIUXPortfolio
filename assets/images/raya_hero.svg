<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="ryBgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0b0e" />
      <stop offset="50%" stop-color="#12141a" />
      <stop offset="100%" stop-color="#090a0d" />
    </linearGradient>

    <radialGradient id="ryGlowOrange" cx="75%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#ff5722" stop-opacity="0.28" />
      <stop offset="50%" stop-color="#ff7a45" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#ff5722" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="ryGlowAmber" cx="20%" cy="80%" r="55%">
      <stop offset="0%" stop-color="#ff9800" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#ff9800" stop-opacity="0" />
    </radialGradient>

    <linearGradient id="ryCardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1a1d26" stop-opacity="0.95" />
      <stop offset="100%" stop-color="#101218" stop-opacity="0.98" />
    </linearGradient>

    <linearGradient id="ryBtnGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ff5722" />
      <stop offset="100%" stop-color="#ff7043" />
    </linearGradient>

    <linearGradient id="ryStreakGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ff7043" />
      <stop offset="100%" stop-color="#ffa726" />
    </linearGradient>

    <filter id="ryPhoneShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="24" stdDeviation="30" flood-color="#000000" flood-opacity="0.8" />
      <feDropShadow dx="0" dy="6" stdDeviation="16" flood-color="#ff5722" flood-opacity="0.22" />
    </filter>

    <filter id="ryGlowFilter" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="10" flood-color="#ff5722" flood-opacity="0.45" />
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="1200" height="675" fill="url(#ryBgGrad)" />
  <rect width="1200" height="675" fill="url(#ryGlowOrange)" />
  <rect width="1200" height="675" fill="url(#ryGlowAmber)" />

  <!-- Technical Atmospheric Grid -->
  <g opacity="0.08" stroke="#ff7a45" stroke-width="1">
    <line x1="0" y1="135" x2="1200" y2="135" />
    <line x1="0" y1="270" x2="1200" y2="270" />
    <line x1="0" y1="405" x2="1200" y2="405" />
    <line x1="0" y1="540" x2="1200" y2="540" />
    <line x1="240" y1="0" x2="240" y2="675" />
    <line x1="480" y1="0" x2="480" y2="675" />
    <line x1="720" y1="0" x2="720" y2="675" />
    <line x1="960" y1="0" x2="960" y2="675" />
  </g>

  <!-- Left Side: Editorial Branding & Metadata -->
  <g transform="translate(80, 110)">
    <!-- Category Badge -->
    <g>
      <rect x="0" y="0" width="220" height="34" rx="17" fill="rgba(255, 87, 34, 0.12)" stroke="#ff5722" stroke-width="1.2" stroke-opacity="0.45" />
      <circle cx="18" cy="17" r="4.5" fill="#ff5722" />
      <text x="32" y="22" font-family="-apple-system, BlinkMacSystemFont, 'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="700" fill="#ff9e80" letter-spacing="1">AI FITNESS · UX CASE STUDY</text>
    </g>

    <!-- Main Title -->
    <text x="0" y="95" font-family="'Space Grotesk', -apple-system, sans-serif" font-size="54" font-weight="800" fill="#ffffff" letter-spacing="-1.5">Raya.</text>
    <text x="0" y="145" font-family="'Plus Jakarta Sans', -apple-system, sans-serif" font-size="32" font-weight="600" fill="#e5e7eb" letter-spacing="-0.5">The coach who</text>
    <text x="0" y="185" font-family="'Newsreader', Georgia, serif" font-size="34" font-style="italic" font-weight="400" fill="#ff8a65">won't let you quit.</text>

    <!-- Description Paragraph -->
    <text x="0" y="235" font-family="-apple-system, BlinkMacSystemFont, 'Plus Jakarta Sans', sans-serif" font-size="15" fill="#9ca3af" font-weight="400">An AI fitness coach for Indian gym beginners.</text>
    <text x="0" y="260" font-family="-apple-system, BlinkMacSystemFont, 'Plus Jakarta Sans', sans-serif" font-size="15" fill="#9ca3af" font-weight="400">Personalised workout + Indian diet plans, in the voice</text>
    <text x="0" y="285" font-family="-apple-system, BlinkMacSystemFont, 'Plus Jakarta Sans', sans-serif" font-size="15" fill="#9ca3af" font-weight="400">of a trusted big brother.</text>

    <!-- Feature Pills -->
    <g transform="translate(0, 325)">
      <!-- Pill 1: Mobile App -->
      <rect x="0" y="0" width="105" height="28" rx="14" fill="#171922" stroke="#2d313f" stroke-width="1" />
      <text x="14" y="18" font-family="sans-serif" font-size="12" font-weight="600" fill="#d1d5db">Mobile App</text>

      <!-- Pill 2: India-First -->
      <rect x="115" y="0" width="95" height="28" rx="14" fill="#171922" stroke="#2d313f" stroke-width="1" />
      <text x="127" y="18" font-family="sans-serif" font-size="12" font-weight="600" fill="#d1d5db">India-First</text>

      <!-- Pill 3: AI Coach -->
      <rect x="220" y="0" width="90" height="28" rx="14" fill="#171922" stroke="#2d313f" stroke-width="1" />
      <text x="232" y="18" font-family="sans-serif" font-size="12" font-weight="600" fill="#d1d5db">AI Coach</text>

      <!-- Pill 4: Dark Mode -->
      <rect x="320" y="0" width="98" height="28" rx="14" fill="#171922" stroke="#2d313f" stroke-width="1" />
      <text x="332" y="18" font-family="sans-serif" font-size="12" font-weight="600" fill="#d1d5db">Dark Mode</text>
    </g>

    <!-- Key Outcome Highlight -->
    <g transform="translate(0, 395)">
      <rect x="0" y="0" width="418" height="72" rx="16" fill="rgba(25, 28, 38, 0.7)" stroke="rgba(255, 87, 34, 0.2)" stroke-width="1" />
      <circle cx="28" cy="36" r="14" fill="rgba(255, 87, 34, 0.15)" />
      <path d="M 23 36 L 27 40 L 34 32" stroke="#ff5722" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round" />
      <text x="52" y="30" font-family="sans-serif" font-size="13" font-weight="700" fill="#ffffff">The 5-Minute Skip Rescue</text>
      <text x="52" y="50" font-family="sans-serif" font-size="12" fill="#9ca3af">Turns would-be skips into micro-sessions so streaks survive.</text>
    </g>
  </g>

  <!-- Right Side: Dual High-Fidelity Mobile App Mockups -->
  <g transform="translate(620, 50)">
    
    <!-- Phone 2: Plan Reveal (Angled/Offset behind) -->
    <g transform="translate(240, 50)" filter="url(#ryPhoneShadow)">
      <!-- Outer Phone Body -->
      <rect x="0" y="0" width="270" height="520" rx="36" fill="#11131a" stroke="#252936" stroke-width="3.5" />
      <!-- Screen Background -->
      <rect x="6" y="6" width="258" height="508" rx="30" fill="#0c0e14" />

      <!-- Notch / Dynamic Island -->
      <rect x="95" y="14" width="80" height="18" rx="9" fill="#000000" />
      <circle cx="160" cy="23" r="3" fill="#1a1a24" />

      <!-- Status bar -->
      <text x="24" y="28" font-family="sans-serif" font-size="11" font-weight="600" fill="#888c9b">9:41</text>

      <!-- Screen Content: Plan Reveal -->
      <g transform="translate(20, 50)">
        <text x="0" y="24" font-family="'Space Grotesk', sans-serif" font-size="20" font-weight="700" fill="#ffffff">Here's what</text>
        <text x="0" y="46" font-family="'Space Grotesk', sans-serif" font-size="20" font-weight="700" fill="#ffffff">I've built</text>
        <text x="0" y="68" font-family="'Space Grotesk', sans-serif" font-size="20" font-weight="700" fill="#ff7a45">for you.</text>

        <!-- Workout Card -->
        <g transform="translate(0, 95)">
          <rect x="0" y="0" width="218" height="96" rx="16" fill="#171a24" stroke="rgba(255, 87, 34, 0.25)" stroke-width="1" />
          <text x="14" y="24" font-family="sans-serif" font-size="11" font-weight="700" fill="#ff8a65" letter-spacing="0.5">WORKOUT</text>
          <text x="14" y="48" font-family="sans-serif" font-size="16" font-weight="700" fill="#ffffff">Push · Pull · Legs</text>
          <text x="14" y="70" font-family="sans-serif" font-size="12" fill="#9ca3af">5 days / week · Gym</text>
        </g>

        <!-- Diet Card -->
        <g transform="translate(0, 205)">
          <rect x="0" y="0" width="218" height="96" rx="16" fill="#171a24" stroke="rgba(255, 87, 34, 0.25)" stroke-width="1" />
          <text x="14" y="24" font-family="sans-serif" font-size="11" font-weight="700" fill="#ff8a65" letter-spacing="0.5">DIET · VEG</text>
          <text x="14" y="48" font-family="sans-serif" font-size="16" font-weight="700" fill="#ffffff">2,100 kcal</text>
          <text x="14" y="70" font-family="sans-serif" font-size="12" fill="#9ca3af">120 g protein · 4 meals</text>
        </g>

        <!-- CTA Button -->
        <g transform="translate(0, 325)">
          <rect x="0" y="0" width="218" height="46" rx="23" fill="url(#ryBtnGrad)" filter="url(#ryGlowFilter)" />
          <text x="109" y="28" font-family="sans-serif" font-size="14" font-weight="700" fill="#ffffff" text-anchor="middle">Let's start</text>
        </g>
      </g>
    </g>

    <!-- Phone 1: Primary "Today" Screen (Forward & Focal) -->
    <g transform="translate(20, 20)" filter="url(#ryPhoneShadow)">
      <!-- Outer Phone Body -->
      <rect x="0" y="0" width="280" height="545" rx="38" fill="#12151e" stroke="#2f3445" stroke-width="4" />
      <!-- Screen Background -->
      <rect x="7" y="7" width="266" height="531" rx="32" fill="#090a0f" />

      <!-- Top Speaker / Dynamic Island -->
      <rect x="98" y="15" width="84" height="20" rx="10" fill="#000000" />
      <circle cx="166" cy="25" r="3.5" fill="#1a1c26" />

      <!-- Status Bar -->
      <text x="28" y="30" font-family="sans-serif" font-size="11" font-weight="600" fill="#ffffff">9:41</text>
      <!-- Signal / Wifi Icons -->
      <g transform="translate(225, 22)" fill="#ffffff">
        <rect x="0" y="6" width="3" height="4" rx="0.5" />
        <rect x="4" y="4" width="3" height="6" rx="0.5" />
        <rect x="8" y="2" width="3" height="8" rx="0.5" />
        <rect x="12" y="0" width="3" height="10" rx="0.5" />
      </g>

      <!-- App Header: Hey Rohan + Streak Pill -->
      <g transform="translate(24, 60)">
        <text x="0" y="20" font-family="'Space Grotesk', sans-serif" font-size="22" font-weight="800" fill="#ffffff">Hey, Rohan</text>
        
        <!-- Streak Pill -->
        <g transform="translate(138, 2)">
          <rect x="0" y="0" width="94" height="24" rx="12" fill="rgba(255, 87, 34, 0.18)" stroke="#ff5722" stroke-width="1.2" />
          <!-- Fire Icon -->
          <path d="M 12 16 C 10 14 10 11 12 9 C 13 11 15 11 15 13 C 15 15 13.5 16 12 16 Z" fill="#ff7043" />
          <text x="24" y="16" font-family="sans-serif" font-size="10.5" font-weight="700" fill="#ff8a65">12-day streak</text>
        </g>
      </g>

      <!-- Main Workout Card (Focal Glowing Element) -->
      <g transform="translate(24, 105)">
        <rect x="0" y="0" width="232" height="185" rx="20" fill="url(#ryCardGrad)" stroke="rgba(255, 87, 34, 0.4)" stroke-width="1.5" />
        
        <text x="18" y="28" font-family="sans-serif" font-size="11" font-weight="700" fill="#ff7a45" letter-spacing="1">TODAY'S WORKOUT</text>
        <text x="18" y="56" font-family="'Space Grotesk', sans-serif" font-size="24" font-weight="800" fill="#ffffff">Push day</text>
        <text x="18" y="80" font-family="sans-serif" font-size="15" font-weight="600" fill="#e0e0e0">Chest &amp; Triceps</text>
        
        <g transform="translate(18, 96)">
          <text x="0" y="12" font-family="sans-serif" font-size="12" fill="#9ca3af">45 min · Beginner</text>
        </g>

        <!-- CTA Button -->
        <g transform="translate(18, 124)">
          <rect x="0" y="0" width="196" height="44" rx="22" fill="url(#ryBtnGrad)" filter="url(#ryGlowFilter)" />
          <text x="98" y="27" font-family="sans-serif" font-size="14" font-weight="700" fill="#ffffff" text-anchor="middle">Start workout</text>
        </g>
      </g>

      <!-- Diet Card -->
      <g transform="translate(24, 305)">
        <rect x="0" y="0" width="232" height="78" rx="18" fill="#151720" stroke="rgba(255, 255, 255, 0.08)" stroke-width="1" />
        <circle cx="28" cy="39" r="14" fill="rgba(255, 87, 34, 0.12)" />
        <!-- Utensils / Diet Icon -->
        <path d="M 25 33 L 25 43 M 28 33 L 28 43 M 31 33 L 31 43" stroke="#ff7a45" stroke-width="1.5" stroke-linecap="round" />
        <text x="50" y="34" font-family="sans-serif" font-size="14" font-weight="700" fill="#ffffff">Today's diet</text>
        <text x="50" y="52" font-family="sans-serif" font-size="12" fill="#9ca3af">4 meals · 2,100 kcal · Veg</text>
      </g>

      <!-- "Can't do it today?" Rescue Link -->
      <g transform="translate(24, 400)">
        <rect x="0" y="0" width="232" height="46" rx="14" fill="rgba(255, 87, 34, 0.06)" stroke="rgba(255, 87, 34, 0.25)" stroke-width="1" stroke-dasharray="4 4" />
        <text x="116" y="28" font-family="sans-serif" font-size="13" font-weight="600" fill="#ff8a65" text-anchor="middle">Can't do it today? →</text>
      </g>

      <!-- Bottom Nav Bar -->
      <g transform="translate(24, 470)">
        <rect x="0" y="0" width="232" height="42" rx="21" fill="#13151d" stroke="rgba(255, 255, 255, 0.06)" stroke-width="1" />
        
        <!-- Tab 1: Today (Active) -->
        <circle cx="40" cy="21" r="5" fill="#ff5722" />
        <!-- Tab 2: Workout -->
        <circle cx="90" cy="21" r="4" fill="#4b5563" />
        <!-- Tab 3: Diet -->
        <circle cx="140" cy="21" r="4" fill="#4b5563" />
        <!-- Tab 4: Ask Raya -->
        <circle cx="190" cy="21" r="4" fill="#4b5563" />
      </g>

    </g>

  </g>
</svg>
